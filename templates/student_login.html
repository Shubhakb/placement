<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - College Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--bg); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: #38bdf8; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .card-container { max-width: 420px; margin: 60px auto; width: 100%; padding: 0 20px; }
        .login-card { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        h2 { font-size: 22px; color: var(--bg); margin-bottom: 8px; font-weight: 700; text-align: center; }
        p.sub { font-size: 14px; color: #64748b; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; display: block; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: var(--primary-dark); }
        .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo"><i class="bi bi-mortarboard-fill"></i> PlacementPortal</a>
        <a href="/company/login" style="color: #cbd5e1; text-decoration: none; font-size: 14px;">Recruiter Login</a>
    </header>

    <div class="card-container">
        <div class="login-card">
            <h2>Student Portal Login</h2>
            <p class="sub">Access your applications, profile, and drive notifications</p>

            {% if error %}
            <div class="alert-error"><i class="bi bi-exclamation-circle-fill"></i> {{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label><i class="bi bi-envelope"></i> Email Address</label>
                    <input type="email" name="email" placeholder="e.g. rahul@college.edu" required>
                </div>
                <div class="form-group">
                    <label><i class="bi bi-lock"></i> Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Sign In to Student Dashboard</button>
            </form>

            <div class="footer-link">
                Don't have an account yet? <a href="/student/register">Register with Gmail & Phone</a>
            </div>
        </div>
    </div>
</body>
</html>
