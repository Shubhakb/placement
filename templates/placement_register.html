<!DOCTYPE html>
<html>
<head>
    <title>Register Placement</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        form {
            max-width: 600px;
            margin: 20px auto;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Register Placement</h1>

    <form method="POST">

        <label>Student</label>

        <select name="student_id" required>
            <option value="">-- Select Student --</option>

            {% for student in students %}
            <option value="{{ student.id }}">
                {{ student.full_name }} - {{ student.usn }}
            </option>
            {% endfor %}

        </select>


        <label>Company</label>

        <select name="company_id" required>
            <option value="">-- Select Company --</option>

            {% for company in companies %}
            <option value="{{ company.id }}">
                {{ company.company_name }}
            </option>
            {% endfor %}

        </select>


        <label>Job</label>

        <select name="job_id" required>
            <option value="">-- Select Job --</option>

            {% for job in jobs %}
            <option value="{{ job.id }}">
                {{ job.job_title }}
            </option>
            {% endfor %}

        </select>


        <label>Package</label>

        <input
            type="number"
            step="0.01"
            name="package"
            placeholder="Enter package"
            required
        >


        <label>Placement Date</label>

        <input
            type="date"
            name="placement_date"
            required
        >


        <label>Status</label>

        <select name="status">
            <option value="Placed">Placed</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
        </select>


        <button type="submit">
            Register Placement
        </button>

    </form>

    <div style="text-align:center;">
        <a href="/placement/list">
            ← Back to Placements
        </a>
    </div>

</body>
</html>python <app class="py"></app>
