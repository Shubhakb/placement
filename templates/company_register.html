<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Registration - Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary: #059669; --primary-dark: #047857; --bg-dark: #0f172a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
        header { background: var(--bg-dark); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: #38bdf8; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 35px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h2 { font-size: 22px; color: var(--bg-dark); margin-bottom: 8px; font-weight: 700; }
        p.sub { font-size: 14px; color: #64748b; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 600; color: #334155; }
        input, select, textarea { padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }
        .btn { padding: 12px 24px; background: var(--primary); color: white; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 15px; }
        .btn:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo"><i class="bi bi-building-fill"></i> PlacementPortal</a>
        <a href="/company/login" style="color: #cbd5e1; text-decoration: none; font-size: 14px;">Already Registered? Log In</a>
    </header>

    <div class="container">
        <div class="card">
            <h2>Recruiter & Company Registration</h2>
            <p class="sub">Register your corporate account to post placement drives and hire campus talent</p>

            <form method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="bi bi-person"></i> Recruiter Name *</label>
                        <input type="text" name="recruiter_name" placeholder="e.g. Ananya Roy" required>
                    </div>
                    <div class="form-group">
                        <label><i class="bi bi-building"></i> Company Name *</label>
                        <input type="text" name="company_name" placeholder="e.g. TechCorp Solutions" required>
                    </div>
                    <div class="form-group">
                        <label><i class="bi bi-envelope"></i> Corporate Email *</label>
                        <input type="email" name="email" placeholder="hr@techcorp.com" required>
                    </div>
                    <div class="form-group">
                        <label><i class="bi bi-lock"></i> Account Password *</label>
                        <input type="password" name="password" placeholder="Set account password" required>
                    </div>
                    <div class="form-group">
                        <label><i class="bi bi-telephone"></i> Contact Phone *</label>
                        <input type="tel" name="phone" placeholder="9876543210" required>
                    </div>
                    <div class="form-group">
                        <label><i class="bi bi-globe"></i> Company Website</label>
                        <input type="url" name="website" placeholder="https://www.company.com">
                    </div>
                    <div class="form-group">
                        <label><i class="bi bi-tag"></i> Industry Sector</label>
                        <select name="industry">
                            <option value="IT & Software">IT & Software Services</option>
                            <option value="Finance & Fintech">Finance & Fintech</option>
                            <option value="Healthcare">Healthcare & Biotech</option>
                            <option value="Consulting">Management Consulting</option>
                            <option value="E-Commerce">E-Commerce & Retail</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="bi bi-geo-alt"></i> Headquarters / Primary Office</label>
                        <input type="text" name="location" placeholder="e.g. Bengaluru, Karnataka">
                    </div>
                    <div class="form-group full-width">
                        <label><i class="bi bi-card-text"></i> Company Overview</label>
                        <textarea name="description" rows="3" placeholder="Brief company summary and hiring domain..."></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label><i class="bi bi-image"></i> Company Logo URL (Optional)</label>
                        <input type="url" name="logo_url" placeholder="https://company.com/logo.png">
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit" class="btn"><i class="bi bi-check-circle-fill"></i> Register Corporate Profile</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
